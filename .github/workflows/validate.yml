name: Validate userscript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate metadata and distribution headers
        run: node scripts/validate-userscript.js
      - name: Run contract tests
        run: node --test tests/userscript-contract.test.js
      - name: Check JavaScript syntax
        run: node --check DoorDashEnhanced.user.js
